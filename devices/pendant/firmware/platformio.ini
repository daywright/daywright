; Daywright pendant firmware: Seeed XIAO ESP32-S3 Sense.
; Build with PlatformIO installed; the toolchain is a large first download.

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; The Sense board has 8 MB PSRAM and 8 MB flash. Camera buffers need PSRAM.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; Libraries are pinned when first added in M3. The camera and I2S microphone
; use the Arduino-ESP32 core; a WebSocket client library is added then.
lib_deps =
